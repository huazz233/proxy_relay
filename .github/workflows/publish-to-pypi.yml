name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.3.1"
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate and update version
        shell: python
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?", version):
              print(f"Invalid version: {version}", file=sys.stderr)
              sys.exit(1)

          files = [
              (
                  Path("proxy_relay/_core.py"),
                  r'__version__\s*=\s*["\'][0-9.\-A-Za-z]+["\']',
                  f'__version__ = "{version}"',
              ),
              (
                  Path("pyproject.toml"),
                  r'version\s*=\s*["\'][0-9.\-A-Za-z]+["\']',
                  f'version = "{version}"',
              ),
          ]

          for path, pattern, replacement in files:
              content = path.read_text(encoding="utf-8")
              new_content, count = re.subn(pattern, replacement, content)
              if count != 1:
                  print(f"Expected one version match in {path}, got {count}", file=sys.stderr)
                  sys.exit(1)
              path.write_text(new_content, encoding="utf-8")

      - name: Commit version locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy_relay/_core.py pyproject.toml
          git diff --staged --quiet || git commit -m "v${RELEASE_VERSION}"

      - name: Build distribution
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Push release commit and tag
        run: |
          git tag -a "v${RELEASE_VERSION}" -m "chore(release): v${RELEASE_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
